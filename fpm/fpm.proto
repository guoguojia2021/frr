syntax = "proto2";

//
// Protobuf definitions pertaining to the Forwarding Plane Manager component.
//

package fpm;

import "qpb/qpb.proto";

//
// A Nexthop for a route. It indicates how packets to a given prefix
// should be forwarded (for instance, send them out of a specified
// interface to a specified address).
//
message Nexthop {
  optional qpb.IfIdentifier if_id = 2;
  optional qpb.L3Address address = 3;
}

message RouteKey {
  optional qpb.L3Prefix prefix = 1;
}

message DeleteRoute {
  required uint32 vrf_id = 1;
  required qpb.AddressFamily address_family = 2;
  required qpb.SubAddressFamily sub_address_family = 3;
  required RouteKey key = 4;
}

message NextHopGroup{
  required uint32 nha_id = 1;
  required uint32 nh_family = 2;
  required uint32 nh_type = 3;
  optional Gate gate = 4;
  required sint32 if_index = 5;
  repeated EncapNest encap_nest =6;
  required uint32 nh_flags = 7;
  required uint32 nh_protocol = 8;
  optional NHGrp nh_grp = 9;
  required uint32 nh_msg_type = 10;
}

message NHGrp{
  required uint32 type = 1;
  required bytes data = 3;
}

message EncapNest{
  required Encap encap = 1;
  required AttrNest attr_nest = 2;
}

message Gate{
  required uint32 type = 1;
  required uint32 family = 2;
  optional bytes in_addr = 3;
  optional bytes in6_addr = 4;
}

message Encap{
  required uint32 type  = 1;
  required uint32 len = 2;
  required uint32 data = 3;
}

message OutLse{
  required uint32 type  = 1;
  required bytes data = 3;
}

message AttrNest{
  required uint32 type = 1;
  required uint32 sub_type = 2;
  optional OutLse out_lse = 3;
  optional Seg6Local seg6_local = 4;
  optional Seg6Segs seg6_segs = 5;
}

message Seg6Local{
  required uint32 action = 1;
  required uint32 type = 2;
  optional bytes nh4 = 3;
  optional bytes nh6 = 4;
  optional uint32 table = 5;
}

message Seg6Segs{
  required uint32 type = 1;
  required bytes data = 3;
}

enum RouteType {
  UNKNOWN = 0;
  NORMAL = 1;
  UNREACHABLE = 2;
  BLACKHOLE = 3;
}

message AddRoute {
  required uint32 vrf_id = 1;
  required qpb.AddressFamily address_family = 2;
  required qpb.SubAddressFamily sub_address_family = 3;
  required RouteKey key = 4;

  optional RouteType route_type = 5;

  required qpb.Protocol protocol = 6;

  required int32 metric = 8;

  repeated Nexthop nexthops = 9;
}

//
// Any message from the FPM.
//
message Message {
  enum Type {
    UNKNOWN_MSG = 0;
    ADD_ROUTE = 1;
    DELETE_ROUTE = 2;
    NHG = 3;
  };

  optional Type type = 1;
  optional AddRoute add_route = 2;
  optional DeleteRoute delete_route = 3;
  optional NextHopGroup next_hop_group = 4;
}
