router bgp 174
 bgp router-id 192.0.0.174
 bgp log-neighbor-changes
 no bgp default ipv4-unicast
 update-delay 120
 bgp graceful-restart
 bgp bestpath as-path multipath-relax
 timers bgp 10 30
 neighbor to-175 peer-group
 neighbor to-175 remote-as 175
 neighbor to-175 solo
 neighbor to-175 advertisement-interval 0
 neighbor to-ixia peer-group
 neighbor to-ixia remote-as 3001
 neighbor to-ixia solo
 neighbor to-ixia advertisement-interval 0
 neighbor 1.5.1.2 peer-group to-175
 neighbor 1.6.1.2 peer-group to-175
 neighbor 1.7.1.2 peer-group to-175
 neighbor 1.8.1.2 peer-group to-175
 neighbor 174.3.1.2 peer-group to-ixia
 neighbor 2001::2 remote-as 175
 neighbor 2001::2 solo
 neighbor 2001::2 capability extended-nexthop
 !
 address-family ipv4 unicast
  neighbor to-175 activate
  neighbor to-175 soft-reconfiguration inbound
  neighbor to-ixia activate
  neighbor to-ixia soft-reconfiguration inbound
  maximum-paths 128
 exit-address-family
 !
 address-family ipv4 vpn
  neighbor 2001::2 activate
 exit-address-family
 !
 address-family ipv6 unicast
  network 1234::1234/128
  redistribute static
  neighbor 2001::2 activate
  maximum-paths 128
 exit-address-family
 !
 address-family ipv6 vpn
  neighbor 2001::2 activate
 exit-address-family
 !
router bgp 174 vrf Vrf1
 bgp disable-ebgp-connected-route-check
 !
 address-family ipv4 unicast
  rd vpn export 3:3
  rt vpn both 2:2
  export vpn
  import vpn
 exit-address-family
 !
 address-family ipv6 unicast
  rd vpn export 4:4
  rt vpn both 2:2
  export vpn
  import vpn
 exit-address-family
!
router bgp 174 vrf Vrf2
 !
 address-family ipv4 unicast
  rd vpn export 4:4
  rt vpn both 2:2
  export vpn
  import vpn
 exit-address-family
!
route-map rp1 permit 10
 set community no-advertise
!