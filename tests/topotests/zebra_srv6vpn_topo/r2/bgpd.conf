router bgp 175
 bgp router-id 192.0.0.175
 bgp log-neighbor-changes
 no bgp default ipv4-unicast
 update-delay 120
 bgp graceful-restart
 bgp bestpath as-path multipath-relax
 no bgp network import-check
 timers bgp 10 30
 neighbor to-174 peer-group
 neighbor to-174 remote-as 174
 neighbor to-174 solo
 neighbor to-174 advertisement-interval 0
 neighbor to-ixia peer-group
 neighbor to-ixia remote-as 3000
 neighbor to-ixia solo
 neighbor to-ixia advertisement-interval 0
 neighbor 1.5.1.1 peer-group to-174
 neighbor 1.6.1.1 peer-group to-174
 neighbor 1.7.1.1 peer-group to-174
 neighbor 1.8.1.1 peer-group to-174
 neighbor 175.3.1.2 peer-group to-ixia
 neighbor 2001::1 remote-as 174
 neighbor 2001::1 solo
 !
 segment-routing srv6
  locator aa
 exit
 !
 address-family ipv4 unicast
  redistribute static
  neighbor to-174 activate
  neighbor to-174 soft-reconfiguration inbound
  neighbor to-ixia activate
  neighbor to-ixia soft-reconfiguration inbound
  maximum-paths 128
 exit-address-family
 !
 address-family ipv4 vpn
  neighbor 2001::1 activate
  neighbor 2001::1 route-map rp out
 exit-address-family
 !
 address-family ipv6 unicast
  neighbor 2001::1 activate
  maximum-paths 128
 exit-address-family
!
router bgp 175 vrf Vrf1
 no bgp network import-check
 !
 segment-routing srv6
  locator aa
 exit
 !
 address-family ipv4 unicast
  redistribute static
  sid vpn export auto
  rd vpn export 1:1
  rt vpn both 2:2
  export vpn
 exit-address-family
 !
 address-family ipv6 unicast
  redistribute static
  sid vpn export auto
  rd vpn export 2:2
  rt vpn both 2:2
  export vpn
 exit-address-family
!
router bgp 175 vrf Vrf2
 no bgp network import-check
 !
 segment-routing srv6
  locator aa
 exit
 !
 address-family ipv4 unicast
  redistribute static route-map rp
  sid vpn export auto
  rd vpn export 22:22
  rt vpn both 2:2
  export vpn
 exit-address-family
!
route-map rp permit 1
 set metric 100
!
route-map rp permit 10
 set extcommunity color 1
!