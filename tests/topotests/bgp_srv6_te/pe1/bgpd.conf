router bgp 200
 timers bgp 0 0
 neighbor 2001:db8:12::2 remote-as 200
 neighbor 2001:db8:12::2 update-source 2001:db8:12::1
 neighbor 2001:db8:12::2 timers connect 10
 neighbor 2001:db8:12::2 capability extended-nexthop
 !
 address-family ipv4 unicast
  network 3.3.3.3/32
  no neighbor 2001:db8:12::2 activate
 exit-address-family
 !
 address-family ipv4 vpn
  neighbor 2001:db8:12::2 activate
  neighbor 2001:db8:12::2 route-map setcolor out
 exit-address-family
 !
 address-family ipv6 unicast
  network fd00:204:d00a:fff0:21::/80 nonconnected
  neighbor 2001:db8:12::2 activate
 exit-address-family
exit
!
router bgp 200 vrf vrf1
 neighbor 192.0.1.1 remote-as 100
 srv6-locator lsid
 !
 address-family ipv4 unicast
  rd vpn export 1:1
  rt vpn import 3:3
  rt vpn export 1:1
  export vpn
  import vpn
 exit-address-family
exit
!
ip prefix-list ip1 seq 5 permit 1.1.1.1/32
ip prefix-list ip2 seq 5 permit 2.2.2.2/32
ip prefix-list ip3 seq 5 permit 3.3.3.3/32
!
ipv6 prefix-list aaa seq 5 permit fd00:204:d00a:fff0:21::/80
!
route-map setcolor permit 10
 match ip address prefix-list ip1
 set extcommunity color 1:1 1:2
exit
!
route-map am permit 10
 match ipv6 address prefix-list aaa
exit
!
route-map denyall deny 20
exit
!