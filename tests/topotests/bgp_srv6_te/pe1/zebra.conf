interface lo
 ip address 10.0.0.1/32
 ipv6 address 2001:db8:1:1::1/128
exit
!
interface pe1-eth1
 ip address 182.0.1.1/24
 ipv6 address 2001:db8:12::1/64
exit
!
interface pe1-eth0
 ip address 192.0.1.2/24
exit
!
ip prefix-list ip1 seq 5 permit 1.1.1.1/32
ip prefix-list ip2 seq 5 permit 2.2.2.2/32
ip prefix-list ip3 seq 5 permit 3.3.3.3/32
!
ipv6 prefix-list aaa seq 5 permit fd00:204:d00a:fff0:21::/80
!
route-map setcolor permit 10
 match ip address prefix-list ip1
exit
!
route-map am permit 10
 match ipv6 address prefix-list aaa
exit
!
route-map denyall deny 20
exit
