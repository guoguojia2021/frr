router bgp 200
 neighbor 2001:db8:13::2 remote-as 200
 neighbor 2001:db8:13::2 update-source 2001:db8:13::1
 neighbor 2001:db8:13::2 timers connect 10
 neighbor 2001:db8:13::2 capability extended-nexthop
 !
 address-family ipv4 vpn
  neighbor 2001:db8:13::2 activate
  neighbor 2001:db8:13::2 route-map setcolor out
 exit-address-family
 !
 address-family ipv6 unicast
  network fd00:204:d00a:fff0:21::/80 nonconnected
  neighbor 2001:db8:13::2 activate
 exit-address-family
exit
!
router bgp 200 vrf vrf1
 neighbor 16.1.1.2 remote-as 100
 srv6-locator lsid
 !
 address-family ipv4 unicast
  network 2.2.2.2/32
  rd vpn export 2:2
  rt vpn import 3:3
  rt vpn export 2:2
  export vpn
  import vpn
 exit-address-family
exit
!
route-map setcolor permit 10
 set extcommunity color 1 2
exit
!
route-map permitall permit 10
exit
