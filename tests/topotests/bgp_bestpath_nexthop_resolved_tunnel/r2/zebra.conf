frr defaults traditional
hostname r2
log file zebra.log
log commands
!
password zebra
!
interface eth10
 ipv6 address 2001:db8:12::2/64
exit
!
interface lo
 ipv6 address 2001:db8:2:2::1/128
exit
!
interface eth1
 ip address 192.168.2.254/24
exit
!
interface eth2
 ip address 192.168.2.254/24
exit
!
route-map sr2 permit 10
exit
!
segment-routing
 srv6
  locators
   locator MAIN prefix fd00:201:2021::/48 block-len 32 node-len 16 func-bits 32 argu-bits 48
    opcode ::fff3:fff:0:0:0 end-dt46 vrf vrf10
   exit
   !
  exit
  !
 !
!
end