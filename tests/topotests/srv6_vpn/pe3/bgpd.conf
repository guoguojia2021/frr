frr defaults traditional

hostname pe3
password zebra
log stdout notifications
log commands
log file bgpd.log

#debug bgp vpn label
router bgp 200
   bgp router-id 3.3.3.3
   bgp cluster-id 3.3.3.3
   no bgp ebgp-requires-policy
   neighbor abcd:100:181:251::2 remote-as 200
   neighbor abcd:100:181:251::2 update-source abcd:100:181:251::1
   neighbor abcd:100:181:251::2 timers 3 10

   neighbor fd00:0:200:101:: remote-as 200
   neighbor fd00:0:200:101:: update-source fd00:0:200:181::
   neighbor fd00:0:200:101:: timers 3 10
   neighbor fd00:0:200:101:: capability extended-nexthop

   address-family ipv6 unicast
     network fd00:0:251:181::/128 nonconnected
     neighbor abcd:100:181:251::2 activate
     no neighbor fd00:0:200:101:: activate
   exit-address-family

   address-family ipv4 vpn
     neighbor fd00:0:200:101:: activate
   exit-address-family

router bgp 200 vrf PUBLIC-TC0

   bgp router-id 192.168.1.1
   no bgp ebgp-requires-policy

   neighbor 192.168.1.2 remote-as 300
   neighbor 192.168.1.2 update-source 192.168.1.1
   neighbor 192.168.1.2 timers 3 10

   address-family ipv4 unicast
     neighbor 192.168.1.2 activate
     neighbor 192.168.1.2 next-hop-self

     rd vpn export 3:200
     rt vpn both 1:200 3:200

     import vpn
     export vpn
   exit-address-family


end
