frr defaults traditional

hostname r1
password zebra
log stdout notifications
log commands
log file bgpd.log debug

#debug bgp nht
#debug bgp zebra

router bgp 200
   bgp router-id 5.5.5.5
   no bgp ebgp-requires-policy
   neighbor abcd:100:171:251::1 remote-as 200
   neighbor abcd:100:171:251::1 update-source abcd:100:171:251::2
   neighbor abcd:100:171:251::1 timers 3 10

   neighbor fd00:0:200:171:: remote-as 200
   neighbor fd00:0:200:171:: update-source fd00:0:200:101::
   neighbor fd00:0:200:171:: timers 3 10
   neighbor fd00:0:200:171:: capability extended-nexthop

   neighbor abcd:100:181:251::1 remote-as 200
   neighbor abcd:100:181:251::1 update-source abcd:100:181:251::2
   neighbor abcd:100:181:251::1 timers 3 10

   neighbor fd00:0:200:181:: remote-as 200
   neighbor fd00:0:200:181:: update-source fd00:0:200:101::
   neighbor fd00:0:200:181:: timers 3 10
   neighbor fd00:0:200:181:: capability extended-nexthop

   address-family ipv6 unicast
     network fd00:0:200:101::/128 nonconnected
     neighbor abcd:100:181:251::1 activate
     neighbor abcd:100:181:251::1 route-reflector-client
     neighbor abcd:100:181:251::1 next-hop-self force
     neighbor abcd:100:171:251::1 activate
     neighbor abcd:100:171:251::1 route-reflector-client
     neighbor abcd:100:171:251::1 next-hop-self force
     no neighbor fd00:0:200:171:: activate
     no neighbor fd00:0:200:181:: activate
   exit-address-family

   address-family ipv4 vpn
     neighbor fd00:0:200:171:: activate
     neighbor fd00:0:200:181:: activate
     neighbor fd00:0:200:171:: route-reflector-client
     neighbor fd00:0:200:181:: route-reflector-client
   exit-address-family

end
